[project]
name = "ebay-lens"
version = "0.1.0"
description = "Read-only eBay search MCP server (official Browse API) with image search and photos Claude can see"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.12,<2",   # 2.x renamed FastMCP; stay on 1.x
    "httpx>=0.27",
    "pillow>=10.1",
]

[project.scripts]
ebay-lens = "ebay_lens.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebay_lens"]
